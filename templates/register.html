<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register - Student Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center" style="min-height: 100vh;">
    <div class="card shadow border-0" style="width: 380px;">
        <div class="card-header bg-success text-white text-center py-3 fw-bold">
            <h4 class="mb-0">Create Account</h4>
        </div>
        <div class="card-body p-4">
            {% if error %}
                <div class="alert alert-danger p-2 text-center" role="alert">{{ error }}</div>
            {% endif %}
            <form action="/register" method="POST">
                <div class="mb-3">
                    <label class="form-label fw-bold">Name</label>
                    <input type="text" name="username" class="form-control" placeholder="Enter Name" required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold">Password</label>
                    <input type="password" name="password" class="form-control" placeholder="Enter Password" required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold">Confirm Password</label>
                    <input type="password" name="confirm_password" class="form-control" placeholder="Re-enter Password" required>
                </div>
                <button type="submit" class="btn btn-success w-100 py-2 fw-bold">Register Account</button>
            </form>
            <div class="text-center mt-3">
                <small>Already registered? <a href="/login">Login here</a></small>
            </div>
        </div>
    </div>
</body>
</html>
