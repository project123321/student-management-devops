<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add Student - Student Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/">🎓 Student Management System</a>
            <a href="/" class="btn btn-outline-light btn-sm">← Back to Dashboard</a>
        </div>
    </nav>

    <div class="container d-flex justify-content-center">
        <div class="card shadow-sm border-0" style="width: 500px;">
            <div class="card-header bg-primary text-white fw-bold py-3">
                <h5 class="mb-0">➕ Add Student & Mark Attendance</h5>
            </div>
            <div class="card-body p-4">
                <form action="/add" method="POST">
                    <div class="mb-3">
                        <label class="form-label fw-bold">Date</label>
                        <input type="date" name="date" class="form-control" value="{{ today_date }}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Full Name</label>
                        <input type="text" name="name" class="form-control" placeholder="e.g. Swathi Mankani" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Roll Number</label>
                        <input type="text" name="roll" class="form-control" placeholder="e.g. 101" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Marks (0 to 100)</label>
                        <input type="number" name="marks" class="form-control" min="0" max="100" placeholder="e.g. 85" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Attendance Status</label>
                        <select name="attendance" class="form-select">
                            <option value="Present" selected>Present</option>
                            <option value="Absent">Absent</option>
                        </select>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 py-2 fw-bold">Save Student Record</button>
                </form>
            </div>
        </div>
    </div>

</body>
</html>
